version: '3.8'

services:
  flask-s3-uploader:
    build: .
    container_name: flask-s3-uploader
    ports:
      - "8000:8000"
    environment:
      - S3_BUCKET=${S3_BUCKET}
      - S3_KEY_PREFIX=${S3_KEY_PREFIX}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - BACKEND_API_TOKEN=${BACKEND_API_TOKEN}
      - TEMP_UPLOAD_DIR=/tmp/db-uploads
      - RETENTION_DAYS=${RETENTION_DAYS:-30}
    volumes:
      - ./uploads:/tmp/db-uploads
    restart: unless-stopped
    # If running on EC2 with IAM role, credentials are automatically available
    # If running locally, uncomment and mount AWS credentials:
    # volumes:
    #   - ~/.aws:/root/.aws:ro
